<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow12" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#232F3E"/>
    </marker>
    <linearGradient id="ctGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0073BB"/>
      <stop offset="100%" stop-color="#01579B"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="#F7F8FA"/>
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#232F3E">AWS CloudTrail - Governance, Compliance &amp; Audit</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#666" font-style="italic">Who did what * when * from where * on which resource - across all AWS APIs</text>

  <!-- Actors -->
  <text x="120" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Actors</text>
  <g font-size="11" fill="#232F3E">
    <rect x="40" y="125" width="170" height="36" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="125" y="148" text-anchor="middle" font-weight="bold">IAM user * Root</text>

    <rect x="40" y="170" width="170" height="36" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="125" y="193" text-anchor="middle" font-weight="bold">IAM Role / STS</text>

    <rect x="40" y="215" width="170" height="36" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="125" y="238" text-anchor="middle" font-weight="bold">AWS Services</text>

    <rect x="40" y="260" width="170" height="36" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="125" y="283" text-anchor="middle" font-weight="bold">Console * CLI * SDK</text>
  </g>

  <line x1="215" y1="220" x2="290" y2="220" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow12)"/>

  <!-- CloudTrail core -->
  <rect x="290" y="130" width="430" height="280" rx="15" fill="url(#ctGrad)" stroke="#232F3E" stroke-width="2"/>
  <text x="505" y="158" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">AWS CloudTrail</text>
  <text x="505" y="178" text-anchor="middle" font-size="11" fill="#fff">Event History (90 days, free, always on) * Trails * Lake</text>

  <g font-size="11" fill="#fff">
    <rect x="310" y="195" width="180" height="80" rx="6" fill="rgba(255,255,255,0.15)" stroke="#fff"/>
    <text x="400" y="218" text-anchor="middle" font-weight="bold">Management Events</text>
    <text x="400" y="237" text-anchor="middle" font-size="10">Control-plane (default)</text>
    <text x="400" y="252" text-anchor="middle" font-size="10">CreateTrail, AttachPolicy</text>
    <text x="400" y="267" text-anchor="middle" font-size="10">ConsoleLogin (non-API)</text>

    <rect x="510" y="195" width="180" height="80" rx="6" fill="rgba(255,255,255,0.15)" stroke="#fff"/>
    <text x="600" y="218" text-anchor="middle" font-weight="bold">Data Events</text>
    <text x="600" y="237" text-anchor="middle" font-size="10">Data-plane (off by default)</text>
    <text x="600" y="252" text-anchor="middle" font-size="10">S3 GetObject / PutObject</text>
    <text x="600" y="267" text-anchor="middle" font-size="10">Lambda Invoke</text>

    <rect x="310" y="285" width="180" height="80" rx="6" fill="rgba(255,255,255,0.15)" stroke="#fff"/>
    <text x="400" y="308" text-anchor="middle" font-weight="bold">Insights Events</text>
    <text x="400" y="327" text-anchor="middle" font-size="10">Unusual API activity</text>
    <text x="400" y="342" text-anchor="middle" font-size="10">ML-based anomaly</text>
    <text x="400" y="357" text-anchor="middle" font-size="10">(off by default)</text>

    <rect x="510" y="285" width="180" height="80" rx="6" fill="rgba(255,255,255,0.15)" stroke="#fff"/>
    <text x="600" y="308" text-anchor="middle" font-weight="bold">Network Activity</text>
    <text x="600" y="327" text-anchor="middle" font-size="10">VPC endpoint activity</text>
    <text x="600" y="342" text-anchor="middle" font-size="10">VPC service endpoint</text>
    <text x="600" y="357" text-anchor="middle" font-size="10">(off by default)</text>
  </g>

  <text x="505" y="395" text-anchor="middle" font-size="10" fill="#fff" font-style="italic">JSON log format * All 4 event types in a single trail * Multi-Region / Organization trails</text>

  <line x1="725" y1="220" x2="800" y2="220" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow12)"/>

  <!-- Destinations -->
  <text x="880" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Destinations</text>
  <g font-size="11" fill="#232F3E">
    <rect x="800" y="125" width="170" height="40" rx="5" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="885" y="148" text-anchor="middle" font-weight="bold">S3 bucket</text>
    <text x="885" y="160" text-anchor="middle" font-size="10">long-term archive</text>

    <rect x="800" y="175" width="170" height="40" rx="5" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="885" y="198" text-anchor="middle" font-weight="bold">CloudWatch Logs</text>
    <text x="885" y="210" text-anchor="middle" font-size="10">alerting + queries</text>

    <rect x="800" y="225" width="170" height="40" rx="5" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="885" y="248" text-anchor="middle" font-weight="bold">EventBridge</text>
    <text x="885" y="260" text-anchor="middle" font-size="10">real-time automation</text>

    <rect x="800" y="275" width="170" height="40" rx="5" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="885" y="298" text-anchor="middle" font-weight="bold">CloudTrail Lake</text>
    <text x="885" y="310" text-anchor="middle" font-size="10">SQL queries (new)</text>
  </g>

  <!-- Best practices -->
  <rect x="40" y="430" width="920" height="150" rx="10" fill="#fff" stroke="#FFC107" stroke-width="2"/>
  <text x="500" y="455" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Security best practices</text>

  <g font-size="11" fill="#232F3E">
    <text x="60" y="485">+  Enable a <tspan font-weight="bold">multi-Region trail</tspan> for full coverage (org trail for AWS Organizations)</text>
    <text x="60" y="505">+  Send logs to a <tspan font-weight="bold">dedicated, locked-down S3 bucket</tspan> in a separate account ("log archive")</text>
    <text x="60" y="525">+  Turn on <tspan font-weight="bold">log file validation</tspan> (SHA-256) and <tspan font-weight="bold">SSE-KMS</tspan>; deny <tspan font-weight="bold">DeleteObject</tspan> via bucket policy</text>
    <text x="60" y="545">+  Stream to CloudWatch Logs &amp; alarm on <tspan font-weight="bold">root login, IAM policy change, security group edits</tspan></text>
    <text x="60" y="565">+  Use <tspan font-weight="bold">CloudTrail Insights</tspan> to detect unusual call rate anomalies (e.g. mass DeleteUser)</text>
  </g>
</svg>
