<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr19" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#232F3E"/>
    </marker>
    <marker id="arr19b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#FF9900"/>
    </marker>
  </defs>
  <rect width="1100" height="680" fill="#F7F8FA"/>
  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#232F3E">Internet Gateway + NAT Gateway -- Egress Flow</text>
  <text x="550" y="65" text-anchor="middle" font-size="13" fill="#666" font-style="italic">Public subnet uses IGW directly.  Private subnet routes outbound through NAT.</text>

  <!-- Internet -->
  <ellipse cx="550" cy="115" rx="120" ry="35" fill="#fff" stroke="#232F3E" stroke-width="2"/>
  <text x="550" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Internet</text>

  <!-- IGW -->
  <rect x="470" y="170" width="160" height="50" rx="6" fill="#FF9900" stroke="#232F3E"/>
  <text x="550" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Internet Gateway</text>
  <text x="550" y="212" text-anchor="middle" font-size="10" fill="#fff">horizontally scaled, redundant</text>

  <line x1="550" y1="150" x2="550" y2="170" stroke="#232F3E" stroke-width="2" marker-end="url(#arr19)"/>
  <line x1="550" y1="220" x2="550" y2="245" stroke="#232F3E" stroke-width="2" marker-end="url(#arr19)"/>

  <!-- VPC outline -->
  <rect x="60" y="245" width="980" height="380" rx="10" fill="#F0F8FF" stroke="#0073BB" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="80" y="270" font-size="14" font-weight="bold" fill="#0073BB">VPC  10.0.0.0/16</text>

  <!-- Public subnet -->
  <rect x="90" y="295" width="430" height="305" rx="8" fill="#E8F5E9" stroke="#3F8624" stroke-width="2"/>
  <text x="105" y="320" font-size="13" font-weight="bold" fill="#3F8624">Public Subnet 10.0.1.0/24  (route: 0.0.0.0/0 -&gt; IGW)</text>

  <rect x="320" y="340" width="170" height="60" rx="6" fill="#fff" stroke="#FF9900"/>
  <text x="405" y="365" text-anchor="middle" font-size="12" font-weight="bold">NAT Gateway</text>
  <text x="405" y="382" text-anchor="middle" font-size="10">Elastic IP attached</text>
  <text x="405" y="395" text-anchor="middle" font-size="10">AZ-bound, up to 100 Gbps</text>

  <rect x="120" y="450" width="170" height="60" rx="6" fill="#fff" stroke="#0073BB"/>
  <text x="205" y="475" text-anchor="middle" font-size="12" font-weight="bold">EC2 (public IP)</text>
  <text x="205" y="492" text-anchor="middle" font-size="10">e.g. ALB, bastion</text>

  <text x="205" y="545" text-anchor="middle" font-size="11" fill="#232F3E">Direct path to IGW</text>
  <line x1="205" y1="450" x2="490" y2="220" stroke="#3F8624" stroke-width="2" marker-end="url(#arr19)" stroke-dasharray="4 3"/>
  <text x="280" y="385" font-size="10" fill="#3F8624">public IP - IGW - Internet</text>

  <!-- Private subnet -->
  <rect x="550" y="295" width="470" height="305" rx="8" fill="#FFF3E0" stroke="#D17C00" stroke-width="2"/>
  <text x="565" y="320" font-size="13" font-weight="bold" fill="#D17C00">Private Subnet 10.0.2.0/24  (route: 0.0.0.0/0 -&gt; NAT GW)</text>

  <rect x="580" y="450" width="170" height="60" rx="6" fill="#fff" stroke="#01A88D"/>
  <text x="665" y="475" text-anchor="middle" font-size="12" font-weight="bold">EC2 App</text>
  <text x="665" y="492" text-anchor="middle" font-size="10">private IP only</text>

  <rect x="800" y="450" width="170" height="60" rx="6" fill="#fff" stroke="#01A88D"/>
  <text x="885" y="475" text-anchor="middle" font-size="12" font-weight="bold">RDS</text>
  <text x="885" y="492" text-anchor="middle" font-size="10">no internet exposure</text>

  <!-- Flow arrows -->
  <line x1="665" y1="450" x2="450" y2="400" stroke="#FF9900" stroke-width="2" marker-end="url(#arr19b)"/>
  <text x="540" y="430" font-size="10" fill="#FF9900" font-weight="bold">1) outbound -&gt; NAT</text>

  <line x1="490" y1="370" x2="610" y2="220" stroke="#FF9900" stroke-width="2" marker-end="url(#arr19b)"/>
  <text x="560" y="295" font-size="10" fill="#FF9900" font-weight="bold">2) NAT -&gt; IGW (SNAT)</text>

  <!-- Notes -->
  <rect x="60" y="640" width="980" height="30" rx="5" fill="#FFEBEE" stroke="#C62828"/>
  <text x="550" y="660" text-anchor="middle" font-size="11" fill="#C62828" font-weight="bold">NAT Gateway is zonal -- deploy one per AZ for HA, else AZ failure breaks egress.  Charges: $0.045/hr + $0.045/GB processed.</text>
</svg>
