<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow11" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#232F3E"/>
    </marker>
    <linearGradient id="ebGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4F8B"/>
      <stop offset="100%" stop-color="#8C4FFF"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="#F7F8FA"/>
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#232F3E">Amazon EventBridge - Serverless Event Bus</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#666" font-style="italic">formerly CloudWatch Events * near real-time * JSON events * loosely coupled</text>

  <!-- Sources -->
  <text x="120" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Event Sources</text>
  <g font-size="11" fill="#232F3E">
    <rect x="40" y="125" width="170" height="40" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="125" y="148" text-anchor="middle" font-weight="bold">AWS Services (90+)</text>

    <rect x="40" y="175" width="170" height="40" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="125" y="198" text-anchor="middle" font-weight="bold">Custom apps (PutEvents)</text>

    <rect x="40" y="225" width="170" height="40" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="125" y="248" text-anchor="middle" font-weight="bold">SaaS partners</text>
    <text x="125" y="262" text-anchor="middle" font-size="9">Datadog, Zendesk, etc.</text>

    <rect x="40" y="280" width="170" height="40" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="125" y="303" text-anchor="middle" font-weight="bold">Scheduler</text>
    <text x="125" y="317" text-anchor="middle" font-size="9">cron / rate / one-time</text>

    <rect x="40" y="335" width="170" height="40" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="125" y="358" text-anchor="middle" font-weight="bold">AWS Health events</text>
  </g>

  <!-- Event bus -->
  <line x1="215" y1="220" x2="290" y2="220" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow11)"/>

  <rect x="290" y="130" width="430" height="320" rx="15" fill="url(#ebGrad)" stroke="#232F3E" stroke-width="2"/>
  <text x="505" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">Event Bus</text>
  <text x="505" y="180" text-anchor="middle" font-size="11" fill="#fff">default * custom * partner</text>

  <!-- Rules -->
  <g font-size="11" fill="#232F3E">
    <rect x="310" y="200" width="180" height="70" rx="6" fill="#fff" stroke="#fff" stroke-width="2"/>
    <text x="400" y="222" text-anchor="middle" font-weight="bold">Rule 1: EC2 State Change</text>
    <text x="400" y="240" text-anchor="middle" font-size="10">{"source":"aws.ec2",</text>
    <text x="400" y="254" text-anchor="middle" font-size="10">"detail-type":"EC2..."}</text>
    <text x="400" y="265" text-anchor="middle" font-size="9" fill="#666">* Lambda + SNS</text>

    <rect x="510" y="200" width="180" height="70" rx="6" fill="#fff" stroke="#fff" stroke-width="2"/>
    <text x="600" y="222" text-anchor="middle" font-weight="bold">Rule 2: S3 Object Put</text>
    <text x="600" y="240" text-anchor="middle" font-size="10">{"source":"aws.s3",</text>
    <text x="600" y="254" text-anchor="middle" font-size="10">"bucket":["raw-images"]}</text>
    <text x="600" y="265" text-anchor="middle" font-size="9" fill="#666">* Step Functions</text>

    <rect x="310" y="280" width="180" height="70" rx="6" fill="#fff" stroke="#fff" stroke-width="2"/>
    <text x="400" y="302" text-anchor="middle" font-weight="bold">Rule 3: Scheduled</text>
    <text x="400" y="320" text-anchor="middle" font-size="10">rate(5 minutes)</text>
    <text x="400" y="334" text-anchor="middle" font-size="10">cron(0 9 ? * MON *)</text>
    <text x="400" y="345" text-anchor="middle" font-size="9" fill="#666">* Lambda backup</text>

    <rect x="510" y="280" width="180" height="70" rx="6" fill="#fff" stroke="#fff" stroke-width="2"/>
    <text x="600" y="302" text-anchor="middle" font-weight="bold">Rule 4: Custom App</text>
    <text x="600" y="320" text-anchor="middle" font-size="10">{"source":"order-svc",</text>
    <text x="600" y="334" text-anchor="middle" font-size="10">"detail-type":"placed"}</text>
    <text x="600" y="345" text-anchor="middle" font-size="9" fill="#666">* SQS + Firehose</text>
  </g>

  <text x="505" y="395" text-anchor="middle" font-size="11" fill="#fff">Schema Registry * Pipes * Archives * Replay * Global Endpoints</text>
  <text x="505" y="415" text-anchor="middle" font-size="10" fill="#fff" font-style="italic">Filtering with event patterns * Input transformation * Dead-letter queues</text>

  <!-- Targets -->
  <line x1="725" y1="220" x2="800" y2="220" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow11)"/>

  <text x="880" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Targets</text>
  <g font-size="11" fill="#232F3E">
    <rect x="800" y="125" width="170" height="36" rx="5" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="885" y="148" text-anchor="middle" font-weight="bold">Lambda</text>

    <rect x="800" y="170" width="170" height="36" rx="5" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="885" y="193" text-anchor="middle" font-weight="bold">SNS * SQS * Firehose</text>

    <rect x="800" y="215" width="170" height="36" rx="5" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="885" y="238" text-anchor="middle" font-weight="bold">Step Functions</text>

    <rect x="800" y="260" width="170" height="36" rx="5" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="885" y="283" text-anchor="middle" font-weight="bold">ECS / Batch / CodePipeline</text>

    <rect x="800" y="305" width="170" height="36" rx="5" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="885" y="328" text-anchor="middle" font-weight="bold">API destinations</text>
    <text x="885" y="340" text-anchor="middle" font-size="9">SaaS &amp; on-prem APIs</text>

    <rect x="800" y="355" width="170" height="36" rx="5" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="885" y="378" text-anchor="middle" font-weight="bold">Kinesis * DynamoDB</text>
  </g>

  <!-- Example payload -->
  <rect x="40" y="475" width="920" height="100" rx="8" fill="#1E1E1E"/>
  <text x="60" y="497" font-size="11" font-family="monospace" fill="#9CDCFE">{</text>
  <text x="60" y="513" font-size="11" font-family="monospace" fill="#9CDCFE">  "version": "0",  "id": "7bf73129-...",  "detail-type": "EC2 Instance State-change Notification",</text>
  <text x="60" y="529" font-size="11" font-family="monospace" fill="#9CDCFE">  "source": "aws.ec2",  "account": "123456789012",  "time": "2026-05-14T12:00:00Z",  "region": "ap-south-1",</text>
  <text x="60" y="545" font-size="11" font-family="monospace" fill="#9CDCFE">  "resources": ["arn:aws:ec2:ap-south-1:123456789012:instance/i-0abc"],</text>
  <text x="60" y="561" font-size="11" font-family="monospace" fill="#9CDCFE">  "detail": { "instance-id": "i-0abc", "state": "stopped" }</text>
  <text x="60" y="575" font-size="11" font-family="monospace" fill="#9CDCFE">}</text>
</svg>
