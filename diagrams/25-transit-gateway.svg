<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr25" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#232F3E"/>
    </marker>
  </defs>
  <rect width="1100" height="720" fill="#F7F8FA"/>
  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#232F3E">AWS Transit Gateway -- Hub-and-Spoke Network</text>
  <text x="550" y="65" text-anchor="middle" font-size="13" fill="#666" font-style="italic">One regional virtual router. Replaces N*(N-1)/2 mesh of VPC peerings.</text>

  <!-- TGW center -->
  <circle cx="550" cy="370" r="100" fill="#FF9900" stroke="#232F3E" stroke-width="3"/>
  <text x="550" y="365" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">Transit</text>
  <text x="550" y="388" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">Gateway</text>
  <text x="550" y="410" text-anchor="middle" font-size="11" fill="#fff">(regional)</text>
  <text x="550" y="425" text-anchor="middle" font-size="10" fill="#fff">50 Gbps per attachment</text>

  <!-- VPCs around -->
  <rect x="60" y="150" width="200" height="100" rx="10" fill="#F0F8FF" stroke="#0073BB" stroke-width="2"/>
  <text x="160" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#0073BB">VPC Prod</text>
  <text x="160" y="200" text-anchor="middle" font-size="11">10.0.0.0/16</text>
  <text x="160" y="220" text-anchor="middle" font-size="10" fill="#666">app + db tier</text>
  <text x="160" y="237" text-anchor="middle" font-size="10" fill="#666">attachment in 2 AZs</text>

  <rect x="60" y="490" width="200" height="100" rx="10" fill="#F0F8FF" stroke="#0073BB" stroke-width="2"/>
  <text x="160" y="520" text-anchor="middle" font-size="14" font-weight="bold" fill="#0073BB">VPC Dev</text>
  <text x="160" y="540" text-anchor="middle" font-size="11">10.1.0.0/16</text>
  <text x="160" y="560" text-anchor="middle" font-size="10" fill="#666">isolated dev env</text>

  <rect x="840" y="150" width="200" height="100" rx="10" fill="#F0F8FF" stroke="#0073BB" stroke-width="2"/>
  <text x="940" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#0073BB">VPC Shared</text>
  <text x="940" y="200" text-anchor="middle" font-size="11">10.2.0.0/16</text>
  <text x="940" y="220" text-anchor="middle" font-size="10" fill="#666">DNS, AD, logs</text>
  <text x="940" y="237" text-anchor="middle" font-size="10" fill="#666">"shared services"</text>

  <rect x="840" y="490" width="200" height="100" rx="10" fill="#F0F8FF" stroke="#0073BB" stroke-width="2"/>
  <text x="940" y="520" text-anchor="middle" font-size="14" font-weight="bold" fill="#0073BB">VPC Sandbox</text>
  <text x="940" y="540" text-anchor="middle" font-size="11">10.3.0.0/16</text>

  <!-- On-prem via DX or VPN -->
  <rect x="430" y="120" width="240" height="80" rx="10" fill="#fff" stroke="#FF9900" stroke-width="2"/>
  <text x="550" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#D17C00">On-Premises (DX + VPN)</text>
  <text x="550" y="170" text-anchor="middle" font-size="10">attachment type: VPN or DX-GW</text>
  <text x="550" y="185" text-anchor="middle" font-size="10">BGP routes propagated to TGW</text>

  <!-- Another region -->
  <rect x="430" y="540" width="240" height="80" rx="10" fill="#fff" stroke="#C7077E" stroke-width="2"/>
  <text x="550" y="568" text-anchor="middle" font-size="13" font-weight="bold" fill="#C7077E">Another Region (TGW peering)</text>
  <text x="550" y="590" text-anchor="middle" font-size="10">inter-region TGW peering</text>
  <text x="550" y="605" text-anchor="middle" font-size="10">cross-Region traffic on AWS backbone</text>

  <!-- Attachment lines -->
  <line x1="260" y1="200" x2="455" y2="335" stroke="#01A88D" stroke-width="2.5" marker-end="url(#arr25)"/>
  <line x1="260" y1="540" x2="455" y2="405" stroke="#01A88D" stroke-width="2.5" marker-end="url(#arr25)"/>
  <line x1="840" y1="200" x2="645" y2="335" stroke="#01A88D" stroke-width="2.5" marker-end="url(#arr25)"/>
  <line x1="840" y1="540" x2="645" y2="405" stroke="#01A88D" stroke-width="2.5" marker-end="url(#arr25)"/>

  <line x1="550" y1="200" x2="550" y2="270" stroke="#FF9900" stroke-width="2.5" marker-end="url(#arr25)"/>
  <line x1="550" y1="470" x2="550" y2="540" stroke="#C7077E" stroke-width="2.5" marker-end="url(#arr25)"/>

  <!-- Bottom: TGW Route Table -->
  <rect x="40" y="630" width="1020" height="80" rx="10" fill="#fff" stroke="#232F3E" stroke-width="2"/>
  <text x="60" y="655" font-size="13" font-weight="bold" fill="#232F3E">TGW Route Tables (per attachment) -- segmentation by association + propagation</text>
  <text x="60" y="678" font-size="11" fill="#232F3E">+ Prod RT: associate Prod att.,  propagate Shared + On-prem  (Prod can reach Shared + on-prem, NOT Dev)</text>
  <text x="60" y="697" font-size="11" fill="#232F3E">+ Dev RT: associate Dev att., propagate Shared only  --  classic firewall-less micro-segmentation</text>

  <!-- Side note -->
  <rect x="40" y="100" width="200" height="30" rx="5" fill="#E8F5E9" stroke="#3F8624"/>
  <text x="140" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#3F8624">Up to 5000 VPCs per TGW</text>

  <rect x="860" y="100" width="200" height="30" rx="5" fill="#E8F5E9" stroke="#3F8624"/>
  <text x="960" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#3F8624">Multicast + ECMP supported</text>
</svg>
