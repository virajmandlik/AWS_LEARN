<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow14" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#232F3E"/>
    </marker>
  </defs>
  <rect width="1000" height="500" fill="#F7F8FA"/>
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#232F3E">Amazon CodeGuru - ML-Powered Code Quality &amp; Performance</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#666" font-style="italic">Reviewer (static, pre-prod) + Profiler (runtime, prod)</text>

  <!-- Reviewer -->
  <rect x="60" y="100" width="420" height="350" rx="12" fill="#fff" stroke="#0073BB" stroke-width="3"/>
  <text x="270" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#0073BB">CodeGuru Reviewer</text>
  <text x="270" y="148" text-anchor="middle" font-size="11" fill="#666" font-style="italic">Automated code reviews on pull requests</text>

  <g font-size="11" fill="#232F3E">
    <rect x="80" y="170" width="170" height="55" rx="5" fill="#E8F4FD" stroke="#0073BB"/>
    <text x="165" y="190" text-anchor="middle" font-weight="bold">Languages</text>
    <text x="165" y="208" text-anchor="middle" font-size="10">Java * Python</text>
    <text x="165" y="220" text-anchor="middle" font-size="10">(others via SecurityScan)</text>

    <rect x="290" y="170" width="170" height="55" rx="5" fill="#E8F4FD" stroke="#0073BB"/>
    <text x="375" y="190" text-anchor="middle" font-weight="bold">Sources</text>
    <text x="375" y="208" text-anchor="middle" font-size="10">CodeCommit * GitHub</text>
    <text x="375" y="220" text-anchor="middle" font-size="10">Bitbucket * GitLab * S3</text>

    <rect x="80" y="235" width="380" height="55" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="270" y="255" text-anchor="middle" font-weight="bold">Detects</text>
    <text x="270" y="273" text-anchor="middle" font-size="10">Security vulnerabilities * Hardcoded secrets</text>
    <text x="270" y="285" text-anchor="middle" font-size="10">Resource leaks * Race conditions * AWS API misuse</text>

    <rect x="80" y="300" width="380" height="55" rx="5" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="270" y="320" text-anchor="middle" font-weight="bold">Modes</text>
    <text x="270" y="338" text-anchor="middle" font-size="10">Full repository scan * Pull request scan</text>
    <text x="270" y="350" text-anchor="middle" font-size="10">CI/CD integration * Code Security Scan</text>

    <rect x="80" y="365" width="380" height="65" rx="5" fill="#1E1E1E"/>
    <text x="270" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">When to use</text>
    <text x="270" y="403" text-anchor="middle" font-size="10" fill="#9CDCFE">Pre-production * Shift-left security</text>
    <text x="270" y="418" text-anchor="middle" font-size="10" fill="#9CDCFE">Catch defects before merge</text>
  </g>

  <!-- Profiler -->
  <rect x="520" y="100" width="420" height="350" rx="12" fill="#fff" stroke="#3F8624" stroke-width="3"/>
  <text x="730" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#3F8624">CodeGuru Profiler</text>
  <text x="730" y="148" text-anchor="middle" font-size="11" fill="#666" font-style="italic">Continuous runtime performance profiling</text>

  <g font-size="11" fill="#232F3E">
    <rect x="540" y="170" width="170" height="55" rx="5" fill="#E8F5E9" stroke="#3F8624"/>
    <text x="625" y="190" text-anchor="middle" font-weight="bold">Languages</text>
    <text x="625" y="208" text-anchor="middle" font-size="10">Java / JVM (Kotlin, Scala)</text>
    <text x="625" y="220" text-anchor="middle" font-size="10">Python</text>

    <rect x="750" y="170" width="170" height="55" rx="5" fill="#E8F5E9" stroke="#3F8624"/>
    <text x="835" y="190" text-anchor="middle" font-weight="bold">Runs on</text>
    <text x="835" y="208" text-anchor="middle" font-size="10">EC2 * ECS * EKS</text>
    <text x="835" y="220" text-anchor="middle" font-size="10">Lambda * on-prem</text>

    <rect x="540" y="235" width="380" height="55" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="730" y="255" text-anchor="middle" font-weight="bold">Identifies</text>
    <text x="730" y="273" text-anchor="middle" font-size="10">Expensive lines of code * CPU hot paths</text>
    <text x="730" y="285" text-anchor="middle" font-size="10">Heap usage * Latency contributors</text>

    <rect x="540" y="300" width="380" height="55" rx="5" fill="#E8F4FD" stroke="#0073BB"/>
    <text x="730" y="320" text-anchor="middle" font-weight="bold">Visualizations</text>
    <text x="730" y="338" text-anchor="middle" font-size="10">Flame graphs * ML-powered recommendations</text>
    <text x="730" y="350" text-anchor="middle" font-size="10">Profiling groups * Anomaly detection</text>

    <rect x="540" y="365" width="380" height="65" rx="5" fill="#1E1E1E"/>
    <text x="730" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">When to use</text>
    <text x="730" y="403" text-anchor="middle" font-size="10" fill="#9CDCFE">Production * Reduce compute cost</text>
    <text x="730" y="418" text-anchor="middle" font-size="10" fill="#9CDCFE">Optimize CPU &amp; latency continuously</text>
  </g>

  <text x="500" y="478" text-anchor="middle" font-size="11" fill="#666" font-style="italic">Reviewer answers "is the code clean?" * Profiler answers "is the code fast/cheap in production?"</text>
</svg>
