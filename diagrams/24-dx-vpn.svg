<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr24" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#232F3E"/>
    </marker>
  </defs>
  <rect width="1100" height="740" fill="#F7F8FA"/>
  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#232F3E">Hybrid Connectivity -- Direct Connect vs Site-to-Site VPN</text>
  <text x="550" y="65" text-anchor="middle" font-size="13" fill="#666" font-style="italic">Two ways to extend on-prem to AWS  --  Often used together for resilience</text>

  <!-- On-prem -->
  <rect x="40" y="100" width="280" height="560" rx="10" fill="#fff" stroke="#232F3E" stroke-width="2"/>
  <text x="180" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#232F3E">On-Premises Data Center</text>
  <rect x="70" y="155" width="220" height="60" rx="6" fill="#E1F5FE" stroke="#0073BB"/>
  <text x="180" y="178" text-anchor="middle" font-size="12" font-weight="bold">Customer Gateway (CGW)</text>
  <text x="180" y="195" text-anchor="middle" font-size="10">physical/virtual router</text>
  <text x="180" y="207" text-anchor="middle" font-size="10">BGP ASN configured</text>

  <rect x="70" y="240" width="220" height="60" rx="6" fill="#FFF3E0" stroke="#FF9900"/>
  <text x="180" y="263" text-anchor="middle" font-size="12" font-weight="bold">Corporate LAN</text>
  <text x="180" y="280" text-anchor="middle" font-size="10">10.99.0.0/16</text>

  <rect x="70" y="325" width="220" height="60" rx="6" fill="#E8F5E9" stroke="#3F8624"/>
  <text x="180" y="348" text-anchor="middle" font-size="12" font-weight="bold">Servers / DBs / Users</text>

  <text x="180" y="425" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">Use cases:</text>
  <text x="180" y="445" text-anchor="middle" font-size="10" fill="#666">migration   |   hybrid app</text>
  <text x="180" y="460" text-anchor="middle" font-size="10" fill="#666">data sync   |   DR site</text>

  <!-- Middle: two paths -->
  <!-- Top: VPN path -->
  <rect x="350" y="125" width="400" height="200" rx="10" fill="#fff" stroke="#01A88D" stroke-width="2"/>
  <text x="550" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#01A88D">Site-to-Site VPN  (IPSec over Internet)</text>
  <text x="370" y="175" font-size="11" fill="#232F3E">+ IPSec tunnels (2 per connection for HA)</text>
  <text x="370" y="195" font-size="11" fill="#232F3E">+ Encrypted -- travels over public internet</text>
  <text x="370" y="215" font-size="11" fill="#232F3E">+ Setup in minutes   |   pay per VPN-hour</text>
  <text x="370" y="235" font-size="11" fill="#232F3E">+ Up to 1.25 Gbps per tunnel (BGP)</text>
  <text x="370" y="255" font-size="11" fill="#232F3E">+ Variable latency, jitter (internet)</text>
  <text x="370" y="275" font-size="11" fill="#232F3E">+ Static or BGP routing</text>
  <text x="370" y="300" font-size="11" font-weight="bold" fill="#01A88D">Best for: quick setup, low/medium traffic, backup</text>

  <!-- Bottom: DX path -->
  <rect x="350" y="395" width="400" height="200" rx="10" fill="#fff" stroke="#FF9900" stroke-width="2"/>
  <text x="550" y="420" text-anchor="middle" font-size="15" font-weight="bold" fill="#D17C00">AWS Direct Connect (DX)  (private fibre)</text>
  <text x="370" y="445" font-size="11" fill="#232F3E">+ Dedicated 1 / 10 / 100 / 400 Gbps fibre</text>
  <text x="370" y="465" font-size="11" fill="#232F3E">+ NOT encrypted by default (add VPN over DX)</text>
  <text x="370" y="485" font-size="11" fill="#232F3E">+ Lead time: weeks-to-months  |  port fee + GB out</text>
  <text x="370" y="505" font-size="11" fill="#232F3E">+ Consistent latency, predictable throughput</text>
  <text x="370" y="525" font-size="11" fill="#232F3E">+ BGP only   |   private + public VIFs</text>
  <text x="370" y="545" font-size="11" fill="#232F3E">+ MACsec encryption supported on 10/100 Gbps</text>
  <text x="370" y="570" font-size="11" font-weight="bold" fill="#D17C00">Best for: high bandwidth, low jitter, compliance</text>

  <!-- arrows from CGW -->
  <line x1="290" y1="185" x2="350" y2="225" stroke="#01A88D" stroke-width="2" marker-end="url(#arr24)"/>
  <line x1="290" y1="355" x2="350" y2="495" stroke="#FF9900" stroke-width="2" marker-end="url(#arr24)"/>

  <!-- AWS side -->
  <rect x="780" y="100" width="280" height="560" rx="10" fill="#fff" stroke="#232F3E" stroke-width="2"/>
  <text x="920" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#232F3E">AWS Region</text>

  <!-- VGW -->
  <rect x="810" y="155" width="220" height="60" rx="6" fill="#E1F5FE" stroke="#0073BB"/>
  <text x="920" y="178" text-anchor="middle" font-size="12" font-weight="bold">Virtual Private Gateway</text>
  <text x="920" y="195" text-anchor="middle" font-size="10">(VGW)  --  VPC attachment</text>
  <text x="920" y="207" text-anchor="middle" font-size="10">classic VPN target</text>

  <!-- DX GW -->
  <rect x="810" y="240" width="220" height="60" rx="6" fill="#FFF3E0" stroke="#FF9900"/>
  <text x="920" y="263" text-anchor="middle" font-size="12" font-weight="bold">Direct Connect Gateway</text>
  <text x="920" y="280" text-anchor="middle" font-size="10">multi-Region / multi-VPC</text>

  <!-- TGW -->
  <rect x="810" y="325" width="220" height="60" rx="6" fill="#FCE4EC" stroke="#C7077E"/>
  <text x="920" y="348" text-anchor="middle" font-size="12" font-weight="bold">Transit Gateway (TGW)</text>
  <text x="920" y="365" text-anchor="middle" font-size="10">scaling target for both DX + VPN</text>

  <!-- VPCs -->
  <rect x="810" y="410" width="220" height="60" rx="6" fill="#F0F8FF" stroke="#0073BB"/>
  <text x="920" y="433" text-anchor="middle" font-size="12" font-weight="bold">VPC 1</text>
  <text x="920" y="450" text-anchor="middle" font-size="10">10.0.0.0/16</text>

  <rect x="810" y="495" width="220" height="60" rx="6" fill="#F0F8FF" stroke="#0073BB"/>
  <text x="920" y="518" text-anchor="middle" font-size="12" font-weight="bold">VPC 2</text>
  <text x="920" y="535" text-anchor="middle" font-size="10">10.1.0.0/16</text>

  <rect x="810" y="580" width="220" height="60" rx="6" fill="#F0F8FF" stroke="#0073BB"/>
  <text x="920" y="603" text-anchor="middle" font-size="12" font-weight="bold">VPC 3</text>
  <text x="920" y="620" text-anchor="middle" font-size="10">10.2.0.0/16</text>

  <line x1="920" y1="385" x2="920" y2="410" stroke="#C7077E" stroke-width="2" marker-end="url(#arr24)"/>
  <line x1="920" y1="385" x2="920" y2="495" stroke="#C7077E" stroke-width="2" marker-end="url(#arr24)"/>
  <line x1="920" y1="385" x2="920" y2="580" stroke="#C7077E" stroke-width="2" marker-end="url(#arr24)"/>

  <line x1="750" y1="225" x2="810" y2="195" stroke="#01A88D" stroke-width="2" marker-end="url(#arr24)"/>
  <line x1="750" y1="495" x2="810" y2="270" stroke="#FF9900" stroke-width="2" marker-end="url(#arr24)"/>

  <!-- Hybrid resilience callout -->
  <rect x="40" y="680" width="1020" height="50" rx="6" fill="#FCE4EC" stroke="#C7077E"/>
  <text x="550" y="703" text-anchor="middle" font-size="12" font-weight="bold" fill="#C7077E">Resilient hybrid pattern: DX as primary + Site-to-Site VPN as backup -- BGP weights pick the active path.</text>
  <text x="550" y="722" text-anchor="middle" font-size="11" fill="#232F3E">For end-to-end encryption with DX, layer a Site-to-Site VPN over the Direct Connect private VIF or use MACsec.</text>
</svg>
