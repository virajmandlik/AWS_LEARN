<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#232F3E"/>
    </marker>
    <linearGradient id="opGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#CC6600"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="#F7F8FA"/>
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#232F3E">AWS Outposts - AWS Infrastructure in Your Data Center</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#666">Fully managed hybrid cloud | Same AWS APIs locally | AWS-installed hardware</text>

  <!-- Customer Data Center -->
  <rect x="40" y="90" width="500" height="430" rx="15" fill="#fff" stroke="#232F3E" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="290" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#232F3E"><� YOUR On-Premises Data Center</text>

  <!-- Outposts Rack -->
  <rect x="70" y="140" width="220" height="280" rx="10" fill="url(#opGrad)" stroke="#232F3E" stroke-width="2"/>
  <text x="180" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">AWS Outposts Rack</text>
  <text x="180" y="183" text-anchor="middle" font-size="10" fill="#fff">(42U) - or Outposts Server (1U/2U)</text>

  <rect x="85" y="200" width="190" height="30" rx="5" fill="#fff"/>
  <text x="180" y="220" text-anchor="middle" font-size="11" font-weight="bold">EC2 Instances</text>

  <rect x="85" y="240" width="190" height="30" rx="5" fill="#fff"/>
  <text x="180" y="260" text-anchor="middle" font-size="11" font-weight="bold">EBS Volumes</text>

  <rect x="85" y="280" width="190" height="30" rx="5" fill="#fff"/>
  <text x="180" y="300" text-anchor="middle" font-size="11" font-weight="bold">S3 on Outposts</text>

  <rect x="85" y="320" width="190" height="30" rx="5" fill="#fff"/>
  <text x="180" y="340" text-anchor="middle" font-size="11" font-weight="bold">ECS / EKS / RDS</text>

  <rect x="85" y="360" width="190" height="30" rx="5" fill="#fff"/>
  <text x="180" y="380" text-anchor="middle" font-size="11" font-weight="bold">ALB / Local Gateway</text>

  <text x="180" y="405" text-anchor="middle" font-size="10" fill="#fff" font-style="italic">AWS Nitro System</text>

  <!-- Local apps -->
  <rect x="310" y="180" width="210" height="220" rx="10" fill="#E8F4F8" stroke="#0073BB" stroke-width="2"/>
  <text x="415" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#0073BB">On-Premises Systems</text>

  <rect x="325" y="225" width="180" height="30" rx="5" fill="#fff" stroke="#0073BB"/>
  <text x="415" y="245" text-anchor="middle" font-size="11">Legacy Apps / DB</text>

  <rect x="325" y="265" width="180" height="30" rx="5" fill="#fff" stroke="#0073BB"/>
  <text x="415" y="285" text-anchor="middle" font-size="11">Manufacturing Systems</text>

  <rect x="325" y="305" width="180" height="30" rx="5" fill="#fff" stroke="#0073BB"/>
  <text x="415" y="325" text-anchor="middle" font-size="11">Healthcare / Financial</text>

  <rect x="325" y="345" width="180" height="30" rx="5" fill="#fff" stroke="#0073BB"/>
  <text x="415" y="365" text-anchor="middle" font-size="11">Low-latency local users</text>

  <line x1="290" y1="280" x2="310" y2="280" stroke="#0073BB" stroke-width="2"/>
  <text x="300" y="270" font-size="9" fill="#0073BB" text-anchor="middle">Low latency</text>

  <text x="290" y="465" text-anchor="middle" font-size="10" fill="#666" font-style="italic">You provide: Power, Space, Cooling, Network, Physical Security</text>
  <text x="290" y="485" text-anchor="middle" font-size="10" fill="#666" font-style="italic">AWS provides: Delivery, Install, Monitoring, Patching, Hardware ops</text>

  <!-- Service Link -->
  <path d="M540,280 Q620,200 620,280 Q620,360 700,280" fill="none" stroke="#FF9900" stroke-width="3" stroke-dasharray="8,4" marker-end="url(#arrO)"/>
  <text x="620" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#FF9900">Service Link</text>
  <text x="620" y="375" text-anchor="middle" font-size="10" fill="#FF9900">Encrypted VPN</text>
  <text x="620" y="390" text-anchor="middle" font-size="10" fill="#FF9900">e500 Mbps</text>
  <text x="620" y="405" text-anchor="middle" font-size="10" fill="#FF9900">d175ms latency</text>

  <!-- AWS Region -->
  <rect x="700" y="170" width="160" height="220" rx="10" fill="#232F3E" stroke="#FF9900" stroke-width="2"/>
  <text x="780" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#FF9900">Parent AWS Region</text>
  <text x="780" y="225" text-anchor="middle" font-size="10" fill="#fff">us-east-1</text>

  <rect x="715" y="245" width="130" height="25" rx="3" fill="#FF9900"/>
  <text x="780" y="262" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Control Plane</text>

  <rect x="715" y="275" width="130" height="25" rx="3" fill="#fff"/>
  <text x="780" y="292" text-anchor="middle" font-size="10">Full AWS Services</text>

  <rect x="715" y="305" width="130" height="25" rx="3" fill="#fff"/>
  <text x="780" y="322" text-anchor="middle" font-size="10">Management APIs</text>

  <rect x="715" y="335" width="130" height="25" rx="3" fill="#fff"/>
  <text x="780" y="352" text-anchor="middle" font-size="10">Monitoring</text>

  <!-- Key facts box -->
  <rect x="50" y="540" width="800" height="50" rx="8" fill="#FFF3E0" stroke="#FF9900"/>
  <text x="450" y="562" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">Use Cases: Low-latency to local systems | Data residency compliance | Local data processing | Migration of dependent apps</text>
  <text x="450" y="580" text-anchor="middle" font-size="11" fill="#D13212">� NOT designed for disconnected/offline operation - requires Service Link to parent Region</text>
</svg>
