<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow13" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#232F3E"/>
    </marker>
    <linearGradient id="xrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F8624"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="600" fill="#F7F8FA"/>
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#232F3E">AWS X-Ray - Distributed Tracing</text>
  <text x="500" y="62" text-anchor="middle" font-size="13" fill="#666" font-style="italic">End-to-end request flow across microservices * service map * latency &amp; errors</text>

  <!-- request flow -->
  <g>
    <rect x="40" y="100" width="120" height="60" rx="8" fill="#fff" stroke="#232F3E" stroke-width="2"/>
    <text x="100" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">Client</text>
    <text x="100" y="145" text-anchor="middle" font-size="10" fill="#666">Trace-Id created</text>

    <line x1="160" y1="130" x2="195" y2="130" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow13)"/>

    <rect x="200" y="100" width="140" height="60" rx="8" fill="#FFE0B2" stroke="#FF9900" stroke-width="2"/>
    <text x="270" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">API Gateway</text>
    <text x="270" y="143" text-anchor="middle" font-size="10" fill="#666">segment</text>

    <line x1="340" y1="130" x2="375" y2="130" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow13)"/>

    <rect x="380" y="100" width="140" height="60" rx="8" fill="#FFE0B2" stroke="#FF9900" stroke-width="2"/>
    <text x="450" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">Lambda: orders</text>
    <text x="450" y="143" text-anchor="middle" font-size="10" fill="#666">segment + subsegments</text>

    <line x1="520" y1="130" x2="555" y2="130" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow13)"/>

    <rect x="560" y="80" width="140" height="40" rx="8" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2"/>
    <text x="630" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">DynamoDB</text>

    <rect x="560" y="140" width="140" height="40" rx="8" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2"/>
    <text x="630" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">SNS publish</text>

    <line x1="700" y1="100" x2="735" y2="100" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow13)"/>
    <line x1="700" y1="160" x2="735" y2="160" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow13)"/>

    <rect x="740" y="80" width="140" height="40" rx="8" fill="#FFCDD2" stroke="#C62828" stroke-width="2"/>
    <text x="810" y="106" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">Stripe API</text>

    <rect x="740" y="140" width="140" height="40" rx="8" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2"/>
    <text x="810" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#232F3E">Lambda: notify</text>
  </g>

  <!-- X-Ray daemon -->
  <text x="500" y="215" text-anchor="middle" font-size="11" fill="#666" font-style="italic">SDK on every service emits segments to the X-Ray daemon (UDP 2000) which forwards to the X-Ray service</text>

  <!-- Trace timeline -->
  <rect x="40" y="240" width="920" height="200" rx="10" fill="#fff" stroke="#3F8624" stroke-width="2"/>
  <text x="500" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#3F8624">Trace Timeline (root segment + subsegments)</text>

  <g font-size="10" fill="#232F3E">
    <text x="55" y="293">Client</text>
    <rect x="120" y="282" width="820" height="14" rx="3" fill="#9E9E9E"/>
    <text x="945" y="293" text-anchor="end" fill="#fff" font-weight="bold">  870 ms</text>

    <text x="55" y="318">API GW</text>
    <rect x="135" y="307" width="800" height="14" rx="3" fill="#FFB300"/>
    <text x="935" y="318" text-anchor="end" fill="#fff" font-weight="bold">  855 ms</text>

    <text x="55" y="343">Lambda orders</text>
    <rect x="170" y="332" width="745" height="14" rx="3" fill="#FF9800"/>
    <text x="915" y="343" text-anchor="end" fill="#fff" font-weight="bold">  820 ms</text>

    <text x="55" y="368">DynamoDB PutItem</text>
    <rect x="190" y="357" width="55" height="14" rx="3" fill="#4CAF50"/>
    <text x="250" y="368" font-size="9" fill="#232F3E">12 ms +</text>

    <text x="55" y="393">Stripe charge</text>
    <rect x="250" y="382" width="600" height="14" rx="3" fill="#F44336"/>
    <text x="855" y="393" font-size="9" fill="#fff" font-weight="bold">  680 ms * 5xx (root cause!)</text>

    <text x="55" y="418">Lambda notify</text>
    <rect x="855" y="407" width="60" height="14" rx="3" fill="#4CAF50"/>
    <text x="920" y="418" font-size="9" fill="#232F3E">18 ms +</text>
  </g>

  <!-- Service map -->
  <rect x="40" y="465" width="450" height="110" rx="8" fill="#fff" stroke="#0073BB" stroke-width="2"/>
  <text x="265" y="488" text-anchor="middle" font-size="13" font-weight="bold" fill="#0073BB">Service Map</text>
  <g>
    <circle cx="100" cy="540" r="22" fill="#3F8624"/>
    <text x="100" y="544" text-anchor="middle" font-size="10" fill="#fff">API</text>
    <circle cx="200" cy="540" r="22" fill="#3F8624"/>
    <text x="200" y="544" text-anchor="middle" font-size="10" fill="#fff">orders</text>
    <circle cx="300" cy="510" r="18" fill="#3F8624"/>
    <text x="300" y="513" text-anchor="middle" font-size="9" fill="#fff">DDB</text>
    <circle cx="300" cy="570" r="18" fill="#C62828"/>
    <text x="300" y="573" text-anchor="middle" font-size="9" fill="#fff">Stripe</text>
    <circle cx="400" cy="540" r="22" fill="#3F8624"/>
    <text x="400" y="544" text-anchor="middle" font-size="10" fill="#fff">notify</text>
    <line x1="122" y1="540" x2="178" y2="540" stroke="#232F3E" stroke-width="2"/>
    <line x1="222" y1="535" x2="282" y2="515" stroke="#232F3E" stroke-width="2"/>
    <line x1="222" y1="545" x2="282" y2="565" stroke="#C62828" stroke-width="3"/>
    <line x1="318" y1="570" x2="378" y2="545" stroke="#232F3E" stroke-width="2"/>
  </g>

  <!-- Use cases -->
  <rect x="510" y="465" width="450" height="110" rx="8" fill="#fff" stroke="#FF9900" stroke-width="2"/>
  <text x="735" y="488" text-anchor="middle" font-size="13" font-weight="bold" fill="#FF9900">When to use X-Ray</text>
  <g font-size="11" fill="#232F3E">
    <text x="525" y="510">+  Microservices / distributed systems - find the slow hop</text>
    <text x="525" y="528">+  Diagnose latency spikes, errors, throttling per dependency</text>
    <text x="525" y="546">+  Trace requests across API GW, Lambda, ECS, EC2, SDKs</text>
    <text x="525" y="564">+  Annotations &amp; metadata for filtering by user/order/tenant</text>
  </g>
</svg>
