<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow8" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#232F3E"/>
    </marker>
    <linearGradient id="cwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4F8B"/>
      <stop offset="100%" stop-color="#C7077E"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="#F7F8FA"/>
  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#232F3E">Amazon CloudWatch - Unified Observability</text>
  <text x="500" y="65" text-anchor="middle" font-size="13" fill="#666" font-style="italic">Metrics + Logs + Alarms + Events from AWS, on-premises, hybrid and other clouds</text>

  <!-- Sources -->
  <rect x="40" y="110" width="200" height="380" rx="10" fill="#fff" stroke="#232F3E" stroke-width="2"/>
  <text x="140" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#232F3E">Data Sources</text>

  <g font-size="12" fill="#232F3E">
    <rect x="55" y="155" width="170" height="40" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="140" y="178" text-anchor="middle" font-weight="bold">EC2 / EBS / ELB</text>

    <rect x="55" y="205" width="170" height="40" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="140" y="228" text-anchor="middle" font-weight="bold">Lambda / ECS / EKS</text>

    <rect x="55" y="255" width="170" height="40" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="140" y="278" text-anchor="middle" font-weight="bold">RDS / DynamoDB / S3</text>

    <rect x="55" y="305" width="170" height="40" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="140" y="328" text-anchor="middle" font-weight="bold">VPC / API Gateway</text>

    <rect x="55" y="355" width="170" height="40" rx="5" fill="#E8F4FD" stroke="#0073BB"/>
    <text x="140" y="378" text-anchor="middle" font-weight="bold">CloudWatch Agent</text>
    <text x="140" y="392" text-anchor="middle" font-size="10">(on-prem / hybrid)</text>

    <rect x="55" y="410" width="170" height="40" rx="5" fill="#E8F4FD" stroke="#0073BB"/>
    <text x="140" y="433" text-anchor="middle" font-weight="bold">Custom Metrics</text>
    <text x="140" y="447" text-anchor="middle" font-size="10">PutMetricData API</text>
  </g>

  <!-- Arrows to CloudWatch -->
  <line x1="245" y1="300" x2="370" y2="300" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow8)"/>

  <!-- CloudWatch core -->
  <rect x="370" y="180" width="260" height="240" rx="15" fill="url(#cwGrad)" stroke="#232F3E" stroke-width="2"/>
  <text x="500" y="215" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">Amazon CloudWatch</text>
  <text x="500" y="235" text-anchor="middle" font-size="11" fill="#fff">Monitoring &amp; Observability</text>

  <g font-size="11" fill="#fff">
    <rect x="390" y="255" width="100" height="60" rx="5" fill="rgba(255,255,255,0.18)" stroke="#fff"/>
    <text x="440" y="278" text-anchor="middle" font-weight="bold">Metrics</text>
    <text x="440" y="295" text-anchor="middle" font-size="9">15 mo retention</text>
    <text x="440" y="307" text-anchor="middle" font-size="9">1-min / detailed</text>

    <rect x="510" y="255" width="100" height="60" rx="5" fill="rgba(255,255,255,0.18)" stroke="#fff"/>
    <text x="560" y="278" text-anchor="middle" font-weight="bold">Logs</text>
    <text x="560" y="295" text-anchor="middle" font-size="9">Standard / IA</text>
    <text x="560" y="307" text-anchor="middle" font-size="9">Logs Insights</text>

    <rect x="390" y="325" width="100" height="60" rx="5" fill="rgba(255,255,255,0.18)" stroke="#fff"/>
    <text x="440" y="348" text-anchor="middle" font-weight="bold">Alarms</text>
    <text x="440" y="365" text-anchor="middle" font-size="9">Metric / Composite</text>
    <text x="440" y="377" text-anchor="middle" font-size="9">3 states</text>

    <rect x="510" y="325" width="100" height="60" rx="5" fill="rgba(255,255,255,0.18)" stroke="#fff"/>
    <text x="560" y="348" text-anchor="middle" font-weight="bold">Dashboards</text>
    <text x="560" y="365" text-anchor="middle" font-size="9">Cross-region</text>
    <text x="560" y="377" text-anchor="middle" font-size="9">Cross-account</text>
  </g>

  <text x="500" y="408" text-anchor="middle" font-size="10" fill="#fff" font-style="italic">Anomaly detection * Container Insights * Synthetics</text>

  <!-- Targets / Actions -->
  <line x1="635" y1="300" x2="760" y2="300" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow8)"/>

  <rect x="760" y="110" width="200" height="380" rx="10" fill="#fff" stroke="#232F3E" stroke-width="2"/>
  <text x="860" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#232F3E">Actions / Targets</text>

  <g font-size="12" fill="#232F3E">
    <rect x="775" y="155" width="170" height="40" rx="5" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="860" y="178" text-anchor="middle" font-weight="bold">SNS Notifications</text>

    <rect x="775" y="205" width="170" height="40" rx="5" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="860" y="228" text-anchor="middle" font-weight="bold">EC2 / Auto Scaling</text>

    <rect x="775" y="255" width="170" height="40" rx="5" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="860" y="278" text-anchor="middle" font-weight="bold">EventBridge Rules</text>

    <rect x="775" y="305" width="170" height="40" rx="5" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="860" y="328" text-anchor="middle" font-weight="bold">Systems Manager</text>
    <text x="860" y="342" text-anchor="middle" font-size="10">OpsItems / Incidents</text>

    <rect x="775" y="355" width="170" height="40" rx="5" fill="#E8F5E9" stroke="#2E7D32"/>
    <text x="860" y="378" text-anchor="middle" font-weight="bold">Lambda</text>
    <text x="860" y="392" text-anchor="middle" font-size="10">(via EventBridge)</text>

    <rect x="775" y="410" width="170" height="40" rx="5" fill="#FFEBEE" stroke="#C62828"/>
    <text x="860" y="433" text-anchor="middle" font-weight="bold">Dashboard widgets</text>
    <text x="860" y="447" text-anchor="middle" font-size="10">Multi-region view</text>
  </g>

  <text x="500" y="540" text-anchor="middle" font-size="12" fill="#666" font-style="italic">CloudWatch eliminates monitoring silos - one place for metrics, logs, traces, and events</text>
  <text x="500" y="565" text-anchor="middle" font-size="11" fill="#666">Free tier metrics * Detailed monitoring at 1-minute granularity * Custom metrics via PutMetricData</text>
</svg>
