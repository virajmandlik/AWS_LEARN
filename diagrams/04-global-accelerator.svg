<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#232F3E"/>
    </marker>
    <linearGradient id="gaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01A88D"/>
      <stop offset="100%" stop-color="#017B66"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="#F7F8FA"/>
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#232F3E">AWS Global Accelerator - Layer 4 Network Performance</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#666">2 Static Anycast IPs | TCP/UDP | AWS Backbone | 130+ PoPs across 53 countries</text>

  <!-- Static IPs banner -->
  <rect x="350" y="80" width="200" height="60" rx="30" fill="url(#gaGrad)" stroke="#232F3E" stroke-width="2"/>
  <text x="450" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">2 Static Anycast IPs</text>
  <text x="450" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">75.2.0.1  &amp;  99.83.0.1</text>

  <!-- Users -->
  <circle cx="70" cy="220" r="30" fill="#fff" stroke="#232F3E" stroke-width="2"/>
  <text x="70" y="225" text-anchor="middle" font-size="10" font-weight="bold">User US</text>

  <circle cx="70" cy="320" r="30" fill="#fff" stroke="#232F3E" stroke-width="2"/>
  <text x="70" y="325" text-anchor="middle" font-size="10" font-weight="bold">User EU</text>

  <circle cx="70" cy="420" r="30" fill="#fff" stroke="#232F3E" stroke-width="2"/>
  <text x="70" y="425" text-anchor="middle" font-size="10" font-weight="bold">User APAC</text>

  <!-- Edge -->
  <rect x="170" y="190" width="140" height="60" rx="8" fill="#FFE5CC" stroke="#FF9900" stroke-width="2"/>
  <text x="240" y="215" text-anchor="middle" font-size="12" font-weight="bold">Edge Location</text>
  <text x="240" y="235" text-anchor="middle" font-size="10">Closest PoP</text>

  <rect x="170" y="290" width="140" height="60" rx="8" fill="#FFE5CC" stroke="#FF9900" stroke-width="2"/>
  <text x="240" y="315" text-anchor="middle" font-size="12" font-weight="bold">Edge Location</text>
  <text x="240" y="335" text-anchor="middle" font-size="10">Closest PoP</text>

  <rect x="170" y="390" width="140" height="60" rx="8" fill="#FFE5CC" stroke="#FF9900" stroke-width="2"/>
  <text x="240" y="415" text-anchor="middle" font-size="12" font-weight="bold">Edge Location</text>
  <text x="240" y="435" text-anchor="middle" font-size="10">Closest PoP</text>

  <!-- AWS Backbone -->
  <rect x="360" y="220" width="180" height="200" rx="10" fill="#232F3E" stroke="#01A88D" stroke-width="3"/>
  <text x="450" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#01A88D">AWS Global</text>
  <text x="450" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#01A88D">Network</text>
  <text x="450" y="305" text-anchor="middle" font-size="11" fill="#fff">Private backbone</text>
  <text x="450" y="325" text-anchor="middle" font-size="11" fill="#fff">Optimal routing</text>
  <text x="450" y="345" text-anchor="middle" font-size="11" fill="#fff">Health checks</text>
  <text x="450" y="365" text-anchor="middle" font-size="11" fill="#fff">Traffic dials %</text>
  <text x="450" y="395" text-anchor="middle" font-size="10" fill="#01A88D" font-style="italic">Up to 60% faster</text>

  <!-- Regions -->
  <rect x="590" y="180" width="170" height="80" rx="8" fill="#fff" stroke="#FF9900" stroke-width="2"/>
  <text x="675" y="205" text-anchor="middle" font-size="12" font-weight="bold">us-east-1</text>
  <text x="675" y="225" text-anchor="middle" font-size="10">ALB / NLB</text>
  <text x="675" y="240" text-anchor="middle" font-size="10">EC2 / Elastic IP</text>
  <text x="675" y="252" text-anchor="middle" font-size="9" fill="#1D8102">[HEALTHY ]</text>

  <rect x="590" y="280" width="170" height="80" rx="8" fill="#fff" stroke="#FF9900" stroke-width="2"/>
  <text x="675" y="305" text-anchor="middle" font-size="12" font-weight="bold">eu-west-1</text>
  <text x="675" y="325" text-anchor="middle" font-size="10">ALB / NLB</text>
  <text x="675" y="340" text-anchor="middle" font-size="10">EC2 / Elastic IP</text>
  <text x="675" y="352" text-anchor="middle" font-size="9" fill="#1D8102">[HEALTHY ]</text>

  <rect x="590" y="380" width="170" height="80" rx="8" fill="#fff" stroke="#D13212" stroke-width="2"/>
  <text x="675" y="405" text-anchor="middle" font-size="12" font-weight="bold">ap-south-1</text>
  <text x="675" y="425" text-anchor="middle" font-size="10">ALB / NLB</text>
  <text x="675" y="440" text-anchor="middle" font-size="10">EC2 / Elastic IP</text>
  <text x="675" y="452" text-anchor="middle" font-size="9" fill="#D13212">[UNHEALTHY ]</text>

  <!-- Arrows -->
  <line x1="100" y1="220" x2="168" y2="220" stroke="#01A88D" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="100" y1="320" x2="168" y2="320" stroke="#01A88D" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="100" y1="420" x2="168" y2="420" stroke="#01A88D" stroke-width="2" marker-end="url(#arrG)"/>

  <line x1="310" y1="220" x2="358" y2="280" stroke="#01A88D" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="310" y1="320" x2="358" y2="320" stroke="#01A88D" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="310" y1="420" x2="358" y2="360" stroke="#01A88D" stroke-width="2" marker-end="url(#arrG)"/>

  <line x1="540" y1="280" x2="588" y2="220" stroke="#01A88D" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="540" y1="320" x2="588" y2="320" stroke="#01A88D" stroke-width="2" marker-end="url(#arrG)"/>
  <line x1="540" y1="380" x2="588" y2="420" stroke="#D13212" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="565" y="395" font-size="9" fill="#D13212" font-weight="bold">FAILS OVER</text>

  <!-- Comparison -->
  <rect x="50" y="480" width="800" height="105" rx="8" fill="#fff" stroke="#01A88D"/>
  <text x="450" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#01A88D">Global Accelerator vs CloudFront</text>
  <g font-size="11" fill="#232F3E">
    <text x="65" y="530"><tspan font-weight="bold" fill="#01A88D">Global Accelerator:</tspan> Layer 4 (TCP/UDP) | Static IPs | No caching | Best for gaming/IoT/VoIP/financial</text>
    <text x="65" y="552"><tspan font-weight="bold" fill="#8C4FFF">CloudFront:</tspan> Layer 7 (HTTP/HTTPS) | DNS names | Caches content | Best for web/CDN content delivery</text>
    <text x="65" y="574"><tspan font-weight="bold">Failover:</tspan> &lt;30 seconds automatic | <tspan font-weight="bold">No DNS changes needed</tspan> when endpoints change | <tspan font-weight="bold">BYOIP</tspan> supported</text>
  </g>
</svg>
