<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#232F3E"/>
    </marker>
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FF6600"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="#F7F8FA"/>
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#232F3E">Amazon Route 53 - DNS Resolution Flow</text>

  <!-- User -->
  <rect x="30" y="100" width="140" height="100" rx="10" fill="#fff" stroke="#232F3E" stroke-width="2"/>
  <text x="100" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">User Browser</text>
  <text x="100" y="160" text-anchor="middle" font-size="12" fill="#555">Types:</text>
  <text x="100" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#0073BB">www.myapp.com</text>

  <!-- Route 53 -->
  <rect x="350" y="80" width="200" height="140" rx="10" fill="url(#awsGrad)" stroke="#232F3E" stroke-width="2"/>
  <text x="450" y="115" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">Amazon Route 53</text>
  <text x="450" y="140" text-anchor="middle" font-size="11" fill="#fff">DNS Service</text>
  <text x="450" y="165" text-anchor="middle" font-size="11" fill="#fff">Hosted Zones</text>
  <text x="450" y="185" text-anchor="middle" font-size="11" fill="#fff">Routing Policies</text>
  <text x="450" y="205" text-anchor="middle" font-size="11" fill="#fff">Health Checks</text>

  <!-- Server -->
  <rect x="730" y="100" width="140" height="100" rx="10" fill="#fff" stroke="#232F3E" stroke-width="2"/>
  <text x="800" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Application</text>
  <text x="800" y="158" text-anchor="middle" font-size="11" fill="#555">EC2 / ALB / S3</text>
  <text x="800" y="183" text-anchor="middle" font-size="13" font-weight="bold" fill="#0073BB">32.45.67.89</text>

  <!-- Arrows -->
  <line x1="170" y1="150" x2="345" y2="150" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="257" y="140" text-anchor="middle" font-size="11" fill="#232F3E" font-weight="bold">1) DNS Query</text>

  <line x1="555" y1="150" x2="725" y2="150" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="140" text-anchor="middle" font-size="11" fill="#232F3E" font-weight="bold">3) HTTP Connect</text>

  <line x1="345" y1="170" x2="170" y2="170" stroke="#0073BB" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="257" y="190" text-anchor="middle" font-size="11" fill="#0073BB" font-weight="bold">2) Returns IP</text>

  <!-- Routing Policies Box -->
  <rect x="120" y="280" width="660" height="180" rx="10" fill="#fff" stroke="#FF9900" stroke-width="2"/>
  <text x="450" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Routing Policies</text>

  <g font-size="11" fill="#232F3E">
    <rect x="140" y="320" width="140" height="55" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="210" y="340" text-anchor="middle" font-weight="bold">Simple</text>
    <text x="210" y="360" text-anchor="middle">Single resource</text>

    <rect x="295" y="320" width="140" height="55" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="365" y="340" text-anchor="middle" font-weight="bold">Weighted</text>
    <text x="365" y="360" text-anchor="middle">% split traffic</text>

    <rect x="450" y="320" width="140" height="55" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="520" y="340" text-anchor="middle" font-weight="bold">Latency-based</text>
    <text x="520" y="360" text-anchor="middle">Lowest latency</text>

    <rect x="605" y="320" width="140" height="55" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="675" y="340" text-anchor="middle" font-weight="bold">Failover</text>
    <text x="675" y="360" text-anchor="middle">Primary/Standby</text>

    <rect x="140" y="385" width="140" height="55" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="210" y="405" text-anchor="middle" font-weight="bold">Geolocation</text>
    <text x="210" y="425" text-anchor="middle">User country</text>

    <rect x="295" y="385" width="140" height="55" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="365" y="405" text-anchor="middle" font-weight="bold">Geoproximity</text>
    <text x="365" y="425" text-anchor="middle">Geo with bias</text>

    <rect x="450" y="385" width="140" height="55" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="520" y="405" text-anchor="middle" font-weight="bold">Multi-value</text>
    <text x="520" y="425" text-anchor="middle">Multiple records</text>

    <rect x="605" y="385" width="140" height="55" rx="5" fill="#FFF3E0" stroke="#FF9900"/>
    <text x="675" y="405" text-anchor="middle" font-weight="bold">IP-based</text>
    <text x="675" y="425" text-anchor="middle">Client IP CIDR</text>
  </g>

  <text x="450" y="485" text-anchor="middle" font-size="11" fill="#666" font-style="italic">Named after DNS port 53 - The Internet's Phone Book</text>
</svg>
