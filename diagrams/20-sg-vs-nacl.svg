<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Arial, sans-serif">
  <rect width="1100" height="720" fill="#F7F8FA"/>
  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#232F3E">Security Groups vs Network ACLs</text>
  <text x="550" y="65" text-anchor="middle" font-size="13" fill="#666" font-style="italic">Two layers of VPC firewalling -- different scope, state, and semantics</text>

  <!-- Left: SG -->
  <rect x="40" y="90" width="500" height="540" rx="10" fill="#fff" stroke="#1E88E5" stroke-width="3"/>
  <rect x="40" y="90" width="500" height="50" rx="10" fill="#1E88E5"/>
  <text x="290" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">Security Group  (instance-level)</text>

  <text x="60" y="170" font-size="13" font-weight="bold" fill="#1E88E5">Scope</text>
  <text x="60" y="190" font-size="12">Attached to an ENI (instance / RDS / ALB / Lambda)</text>

  <text x="60" y="220" font-size="13" font-weight="bold" fill="#1E88E5">State</text>
  <text x="60" y="240" font-size="12">STATEFUL -- return traffic auto-allowed</text>

  <text x="60" y="270" font-size="13" font-weight="bold" fill="#1E88E5">Rules</text>
  <text x="60" y="290" font-size="12">ALLOW only -- no explicit deny</text>
  <text x="60" y="307" font-size="12">All rules evaluated (no order)</text>
  <text x="60" y="324" font-size="12">Default OUT = allow all,  IN = deny all</text>

  <text x="60" y="354" font-size="13" font-weight="bold" fill="#1E88E5">Source / Destination</text>
  <text x="60" y="374" font-size="12">CIDR  |  another SG (self-referencing OK)</text>
  <text x="60" y="391" font-size="12">Prefix lists  |  managed prefix lists</text>

  <text x="60" y="421" font-size="13" font-weight="bold" fill="#1E88E5">Quotas</text>
  <text x="60" y="441" font-size="12">Up to 5 SGs per ENI (soft, raise to 16)</text>
  <text x="60" y="458" font-size="12">60 inbound + 60 outbound rules</text>

  <text x="60" y="488" font-size="13" font-weight="bold" fill="#1E88E5">Example</text>
  <rect x="60" y="500" width="460" height="115" rx="5" fill="#E1F5FE" stroke="#0073BB"/>
  <text x="75" y="520" font-size="11" font-family="Courier New, monospace">Inbound:</text>
  <text x="75" y="538" font-size="11" font-family="Courier New, monospace">  Allow TCP 443 from 0.0.0.0/0       (web)</text>
  <text x="75" y="556" font-size="11" font-family="Courier New, monospace">  Allow TCP 22  from 10.0.0.0/16     (SSH)</text>
  <text x="75" y="574" font-size="11" font-family="Courier New, monospace">Outbound:</text>
  <text x="75" y="592" font-size="11" font-family="Courier New, monospace">  Allow ALL to 0.0.0.0/0  (default)</text>
  <text x="75" y="608" font-size="10" fill="#666">(stateful: response on 443 returns automatically)</text>

  <!-- Right: NACL -->
  <rect x="560" y="90" width="500" height="540" rx="10" fill="#fff" stroke="#D17C00" stroke-width="3"/>
  <rect x="560" y="90" width="500" height="50" rx="10" fill="#D17C00"/>
  <text x="810" y="122" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">Network ACL  (subnet-level)</text>

  <text x="580" y="170" font-size="13" font-weight="bold" fill="#D17C00">Scope</text>
  <text x="580" y="190" font-size="12">Bound to one or more subnets (1 NACL per subnet)</text>

  <text x="580" y="220" font-size="13" font-weight="bold" fill="#D17C00">State</text>
  <text x="580" y="240" font-size="12">STATELESS -- return traffic NOT auto-allowed</text>

  <text x="580" y="270" font-size="13" font-weight="bold" fill="#D17C00">Rules</text>
  <text x="580" y="290" font-size="12">ALLOW + DENY (use deny to block IPs)</text>
  <text x="580" y="307" font-size="12">Evaluated lowest -&gt; highest rule number</text>
  <text x="580" y="324" font-size="12">First match wins, then stop</text>

  <text x="580" y="354" font-size="13" font-weight="bold" fill="#D17C00">Source / Destination</text>
  <text x="580" y="374" font-size="12">CIDR ranges only (no SG, no prefix list)</text>

  <text x="580" y="404" font-size="13" font-weight="bold" fill="#D17C00">Defaults</text>
  <text x="580" y="424" font-size="12">Default NACL = allow all in + out</text>
  <text x="580" y="441" font-size="12">Custom NACL = deny all in + out (until you add rules)</text>
  <text x="580" y="458" font-size="12">Rule numbers 1 -- 32766 ;  * = catch-all DENY</text>

  <text x="580" y="488" font-size="13" font-weight="bold" fill="#D17C00">Example</text>
  <rect x="580" y="500" width="460" height="115" rx="5" fill="#FFF3E0" stroke="#D17C00"/>
  <text x="595" y="520" font-size="11" font-family="Courier New, monospace">Inbound:</text>
  <text x="595" y="538" font-size="11" font-family="Courier New, monospace">  100 ALLOW TCP 443    0.0.0.0/0</text>
  <text x="595" y="556" font-size="11" font-family="Courier New, monospace">  110 DENY  ALL        1.2.3.4/32   (block bad IP)</text>
  <text x="595" y="574" font-size="11" font-family="Courier New, monospace">Outbound:</text>
  <text x="595" y="592" font-size="11" font-family="Courier New, monospace">  100 ALLOW TCP 1024-65535 0.0.0.0/0 (ephemeral)</text>
  <text x="595" y="608" font-size="10" fill="#666">(stateless: MUST open ephemeral ports for return traffic)</text>

  <!-- Footer comparison -->
  <rect x="40" y="650" width="1020" height="55" rx="6" fill="#FCE4EC" stroke="#C7077E"/>
  <text x="550" y="675" text-anchor="middle" font-size="13" font-weight="bold" fill="#C7077E">Memory hook:  SG = bouncer at the door (per guest), NACL = guard at the gate (per neighbourhood)</text>
  <text x="550" y="695" text-anchor="middle" font-size="11" fill="#232F3E">Both layers apply to every packet.  SGs are the everyday tool; NACLs are for blanket deny rules.</text>
</svg>
