name: sync-aws-docs

on:
  schedule:
    - cron: "0 6 1,15 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no Notion writes)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "docs.config.json"
      - "scripts/**"
      - ".github/workflows/sync-aws-docs.yml"

permissions:
  contents: write
  models: read

concurrency:
  group: sync-aws-docs
  cancel-in-progress: false

jobs:
  sync:
    name: Sync AWS docs to Notion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOG_LEVEL: info
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Validate required secrets
        run: |
          if [ -z "${NOTION_TOKEN}" ] && [ "${DRY_RUN}" != "1" ]; then
            echo "::error::NOTION_TOKEN secret is missing. Add it under Repo Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run sync
        id: sync
        run: node scripts/sync.mjs

      - name: Commit updated cache and snapshots
        if: always() && steps.sync.outcome != 'cancelled'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cache/manifest.json snapshots/
          if git diff --staged --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          CHANGED="${{ steps.sync.outputs.changed }}"
          UNCHANGED="${{ steps.sync.outputs.unchanged }}"
          ERRORS="${{ steps.sync.outputs.errors }}"
          MSG="chore(sync): aws-docs sync (changed=${CHANGED:-0}, unchanged=${UNCHANGED:-0}, errors=${ERRORS:-0})"
          git commit -m "${MSG}" -m "Auto-generated by sync-aws-docs workflow."
          for i in 1 2 3; do
            if git push; then
              break
            fi
            echo "Push attempt $i failed; rebasing and retrying"
            git pull --rebase --autostash
          done
